<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fdf3f6">
<meta name="apple-mobile-web-app-title" content="소별로망스">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>소별로망스</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf3f6;--card:rgba(255,255,255,.88);--tx:#3a2c33;--sub:#8c7a84;--pri:#c4547c;--pri2:#fbe3ec;--ok:#5a8a52;--bad:#c2453f;--line:#f0d8e2;--navbg:#fcf6ea;--olive:#6d7f50;--wash:radial-gradient(70% 45% at 8% 0%,#f8c9d9 0,rgba(248,201,217,0) 70%),radial-gradient(60% 40% at 100% 14%,#fbe0ea 0,rgba(251,224,234,0) 70%),radial-gradient(80% 50% at 50% 100%,#fbe6ee 0,rgba(251,230,238,0) 70%);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#211820;--card:rgba(52,38,47,.9);--tx:#f6e9ef;--sub:#b7a2ae;--pri:#e57aa5;--pri2:#4a2c3d;--ok:#a5cb8f;--bad:#f07c75;--line:#46323d;--navbg:#2a1f27;--olive:#b9cf93;--wash:radial-gradient(70% 45% at 8% 0%,rgba(190,90,130,.28) 0,rgba(0,0,0,0) 70%),radial-gradient(60% 40% at 100% 14%,rgba(150,80,110,.2) 0,rgba(0,0,0,0) 70%);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#211820;--card:rgba(52,38,47,.9);--tx:#f6e9ef;--sub:#b7a2ae;--pri:#e57aa5;--pri2:#4a2c3d;--ok:#a5cb8f;--bad:#f07c75;--line:#46323d;--navbg:#2a1f27;--olive:#b9cf93;--wash:radial-gradient(70% 45% at 8% 0%,rgba(190,90,130,.28) 0,rgba(0,0,0,0) 70%),radial-gradient(60% 40% at 100% 14%,rgba(150,80,110,.2) 0,rgba(0,0,0,0) 70%);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--wash);pointer-events:none}
body{margin:0;background:transparent;color:var(--tx);font:16px/1.55 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;padding-bottom:84px}
h1,h2,.num{font-family:"Gowun Batang","Apple Myungjo",serif;font-weight:700}
header{padding:18px 18px 6px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:24px;margin:0;display:flex;align-items:center;gap:8px}
h2{font-size:18px;margin:22px 18px 8px;color:var(--olive)}
main{max-width:640px;margin:0 auto}
.sec{padding:0 14px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(196,84,124,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat small{color:var(--sub);display:block}
.stat .num{font-size:22px}
.stat.big{background:var(--pri);border-color:var(--pri);color:#fff}
.stat.big small{color:#ffe3f0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.list{border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px;box-shadow:0 2px 10px rgba(196,84,124,.08)}
.list .row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:13px}
.amt{font-weight:700;white-space:nowrap}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--pri2);flex:none}
.hero{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:var(--pri2)}
.ph{width:56px;height:56px;border-radius:12px;background:var(--pri2);display:grid;place-items:center;font-size:22px;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--sub);font:inherit;font-size:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--pri);font-weight:700}
button.pri,button.ghost,button.del{font:inherit;border-radius:12px;padding:10px 16px;border:0;font-weight:500}
button.pri{background:var(--pri);color:#fff}
button.ghost{background:var(--pri2);color:var(--pri)}
button.del{background:none;color:var(--bad)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:28px;border:0;background:var(--pri);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin-bottom:10px}
textarea{resize:vertical;line-height:1.5;min-height:120px}
label{font-size:13px;color:var(--sub);display:block;margin-bottom:3px}
.search{margin:6px 14px 10px;width:calc(100% - 28px)}
#sheet{position:fixed;inset:0;background:rgba(20,10,25,.5);display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
#sheet .in{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.photos{display:flex;gap:10px;margin-bottom:10px}
.photos>div{flex:1;text-align:center}
.photos img,.photos .ph2{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:var(--pri2);display:grid;place-items:center;color:var(--pri);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--pri2);color:var(--pri)}
.low{color:var(--bad)}
.back{background:none;border:0;color:var(--pri);font:inherit;font-size:15px;padding:0}
.gal{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
.gal img{width:46%;flex:none;aspect-ratio:1;object-fit:cover;border-radius:14px}
.empty{text-align:center;color:var(--sub);padding:34px 20px}
.seg{display:flex;gap:6px;margin:0 14px 10px}
.seg button{flex:1;border:0;padding:8px;border-radius:10px;background:var(--card);color:var(--sub);font:inherit;border:1px solid var(--line)}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
</style>
</head>
<body data-netlify-sections="false">
<main id="app"></main>
<nav id="nav"></nav>
<div id="sheet"><div class="in" id="sin"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
var S={customers:[],orders:[],stock:[],log:[],prods:[]},tab='home',cid=null,q='',stockSeg='all',db=null,pc={},tmp={};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function won(n){return Math.round(n).toLocaleString('ko-KR')+'원'}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ymd(new Date())}
function wkStart(s){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function sum(a){return a.reduce(function(t,o){return t+(+o.amount||0)},0)}
function fmtD(s){var p=s.split('-');return p[0]+'.'+p[1]+'.'+p[2]}
/* ---- 저장 (아이폰 내부 IndexedDB) ---- */
function open(){return new Promise(function(res){try{var r=indexedDB.open('sobyeol',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');r.result.createObjectStore('ph')};r.onsuccess=function(){db=r.result;res()};r.onerror=function(){res()}}catch(e){res()}})}
function idb(st,mode,fn){return new Promise(function(res){if(!db)return res(null);try{var t=db.transaction(st,mode),s=t.objectStore(st),r=fn(s);t.oncomplete=function(){res(r&&r.result)};t.onerror=function(){res(null)}}catch(e){res(null)}})}
function save(){return idb('kv','readwrite',function(s){return s.put(S,'state')})}
function putPhoto(data){var id=uid();pc[id]=data;idb('ph','readwrite',function(s){return s.put(data,id)});return id}
function getPhoto(id){return pc[id]?Promise.resolve(pc[id]):idb('ph','readonly',function(s){return s.get(id)}).then(function(d){if(d)pc[id]=d;return d})}
function hydrate(root){(root||document).querySelectorAll('img[data-p]').forEach(function(im){getPhoto(im.dataset.p).then(function(d){if(d)im.src=d})})}
function shrink(file){return new Promise(function(res){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=1000,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.src=fr.result};fr.readAsDataURL(file)})}
/* ---- 화면 ---- */
function pimg(id,cls){return id?'<img class="'+cls+'" data-p="'+id+'" alt="">':'<div class="'+(cls=='thumb'?'ph':'hero ph')+'">💐</div>'}
function cust(id){return S.customers.find(function(c){return c.id==id})||{name:'?',phone:''}}
function ordersOf(id){return S.orders.filter(function(o){return o.cid==id}).sort(function(a,b){return b.date<a.date?-1:1})}
function render(){
 var h='';
 if(tab=='home')h=vHome();else if(tab=='cust')h=cid?vDetail():vCust();else if(tab=='sales')h=vSales();else if(tab=='prod')h=vProd();else h=vStock();
 $('app').innerHTML=h;
 $('nav').innerHTML=[['home','🏠','홈'],['cust','👤','고객'],['sales','💰','매출'],['stock','🌿','재고'],['prod','📦','제품']].map(function(t){return '<button class="'+(tab==t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('');
 hydrate($('app'));window.scrollTo(0,0);
}
function go(t){tab=t;cid=null;q='';render()}
function FL(s){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 32 32" aria-hidden="true" style="flex:none"><g fill="#ee86ae"><circle cx="16" cy="8.5" r="6.5"/><circle cx="23.1" cy="13.7" r="6.5"/><circle cx="20.4" cy="22" r="6.5"/><circle cx="11.6" cy="22" r="6.5"/><circle cx="8.9" cy="13.7" r="6.5"/></g><circle cx="16" cy="16" r="4.2" fill="#ffd05c"/></svg>'}
function head(t,r){return '<header><h1>'+FL(28)+t+'</h1>'+(r||'')+'</header>'}
function vHome(){
 var t=today(),w=wkStart(t),m=t.slice(0,7),y=t.slice(0,4),O=S.orders;
 var rec=O.slice().sort(function(a,b){return b.date<a.date?-1:1}).slice(0,5);
 return head('소별로망스 리부케')+'<div class="sec"><div class="grid">'+
 '<div class="card stat big"><small>누적 고객수</small><span class="num">'+S.customers.length+'명</span></div>'+
 '<div class="card stat big"><small>전체 누적 금액</small><span class="num">'+won(sum(O))+'</span></div>'+
 '<div class="card stat"><small>이번 주</small><span class="num">'+won(sum(O.filter(function(o){return wkStart(o.date)==w})))+'</span></div>'+
 '<div class="card stat"><small>이번 달</small><span class="num">'+won(sum(O.filter(function(o){return o.date.slice(0,7)==m})))+'</span></div>'+
 '</div><div class="card stat"><small>올해 ('+y+')</small><span class="num">'+won(sum(O.filter(function(o){return o.date.slice(0,4)==y})))+'</span></div></div>'+
 '<h2>최근 주문</h2><div class="sec"><div class="list">'+(rec.length?rec.map(orderRow).join(''):'<div class="empty">아래 + 버튼으로 첫 주문을 기록하세요<br><br><button class="ghost" onclick="loadSample()">샘플 데이터로 미리 보기</button></div>')+'</div></div>'+'<h2>엑셀 백업</h2><div class="sec"><div class="card"><div class="sub" style="margin-bottom:10px">'+(S.bk?'마지막 내보내기: '+S.bk:'아직 내보낸 적이 없어요')+'<br>고객·주문·사진·재고·제품이 모두 엑셀 한 파일에 들어가요. 폰을 바꾸거나 앱을 지우기 전에 꼭 내보내세요.</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="pri" onclick="exportXlsx()">엑셀 내보내기</button><button class="ghost" onclick="document.getElementById(\'impx\').click()">엑셀 불러오기</button></div><input id="impx" type="file" accept=".xlsx" hidden onchange="importXlsx(this)"></div></div>'+(O.length||S.stock.length?'<div style="text-align:center;margin:10px"><button class="del" style="color:var(--sub);font-size:13px" onclick="wipe()">모든 데이터 삭제</button></div>':'')+fab();
}
function fab(){return '<button class="fab" onclick="orderForm()">＋</button>'}
var DL=['직접','퀵','택배'],INQ=['카톡','톡톡','인스타'],RVC=['네이버','블로그','카페','인스타'],PAY=['카드','현금','계좌이체','간편결제','기타'];
function selOpt(L,v){return '<option value="">선택 안 함</option>'+L.map(function(x){return '<option'+(x==v?' selected':'')+'>'+x+'</option>'}).join('')}
function tgl(){$('g_itw').style.display=$('g_i').value=='예'?'block':'none';$('g_rcw').style.display=$('g_r').value=='참여'?'block':'none'}
function opt1(v,L){v=sv(v);return L.indexOf(v)>=0?v:''}
function infoHtml(o){var a=[];if(o.inq)a.push('문의 '+esc(o.inq));if(o.dlv)a.push('전달 '+esc(o.dlv));if(o.pk)a.push('픽업 '+esc(o.pk));if(o.ini)a.push('이니셜 '+esc(o.ini)+(o.ini=='예'&&o.iniTxt?' “'+esc(o.iniTxt)+'”':''));if(o.rv)a.push('리뷰 '+esc(o.rv)+(o.rv=='참여'&&o.rvCh?' ('+esc(o.rvCh)+')':''));return a.length?'<div class="sub" style="margin-top:3px;line-height:2">'+a.map(function(t){return '<span class="tag">'+t+'</span>'}).join(' ')+'</div>':''}
function isDone(o){return !!(o.done||o.fin)}
var CHK='<svg width="19" height="19" viewBox="0 0 24 24" aria-label="완료" style="vertical-align:-4px;margin-right:5px;flex:none"><circle cx="12" cy="12" r="11" fill="#2e9e5b"/><path d="M6.5 12.5l3.6 3.6 7.4-7.6" fill="none" stroke="#fff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function custDone(os){return os.length>0&&os.every(isDone)}
function custPhoto(os,ok){if(ok){var d=os.filter(function(o){return o.done})[0]||os[0];return d?(d.done||d.prod):null}var l=os.filter(function(o){return !isDone(o)})[0]||os[0];return l?(l.prod||l.done):null}
function orderRow(o){var c=cust(o.cid);return '<div class="row" onclick="cid=\''+o.cid+'\';tab=\'cust\';render()">'+pimg(o.done||o.prod,'thumb')+'<div class="grow"><b>'+esc(c.name)+'</b><div class="sub">'+esc(o.item||'상품 미입력')+' · '+fmtD(o.date)+'</div></div><div class="amt">'+won(o.amount)+'</div></div>'}
function vCust(){
 var L=S.customers.filter(function(c){return !q||c.name.indexOf(q)>=0||c.phone.replace(/\D/g,'').indexOf(q.replace(/\D/g,'')||'§')>=0}).sort(function(a,b){var x=ordersOf(a.id)[0],y=ordersOf(b.id)[0];return (y?y.date:'')<(x?x.date:'')?-1:1});
 var nd=S.customers.filter(function(c){return custDone(ordersOf(c.id))}).length,nn=S.customers.length-nd;
 return head('고객 '+S.customers.length+'명')+'<div class="sec"><div class="grid"><div class="card stat"><small>'+CHK+'완료</small><span class="num" style="color:var(--ok)">'+nd+'명</span></div><div class="card stat"><small>미완료</small><span class="num" style="color:var(--pri)">'+nn+'명</span></div></div></div><input class="search" placeholder="이름 또는 전화번호 검색" value="'+esc(q)+'" oninput="q=this.value;var p=this.selectionStart;render();var e=document.querySelector(\'.search\');e.focus();e.setSelectionRange(p,p)"><div class="sec"><div class="list">'+
 (L.length?L.map(function(c){var os=ordersOf(c.id),ok=custDone(os);return '<div class="row" onclick="cid=\''+c.id+'\';render()">'+pimg(custPhoto(os,ok),'thumb')+'<div class="grow"><b>'+(ok?CHK:'')+esc(c.name)+'</b><div class="sub">'+esc(c.phone)+' · 주문 '+os.length+'건 · '+(ok?'완료':'미완료')+'</div></div><div class="amt">'+won(sum(os))+'</div></div>'}).join(''):'<div class="empty">고객이 없습니다</div>')+'</div></div>'+fab();
}
function telH(n){var d=String(n||'').replace(/[^\d+]/g,'');return d?'tel:%2A281'+d:'#'}
function vDetail(){
 var c=cust(cid),os=ordersOf(cid),dn=os.filter(function(o){return o.done||o.prod});
 var months={};os.slice().reverse().forEach(function(o){var k=o.date.slice(0,7);months[k]=(months[k]||0)+(+o.amount||0)});
 var acc=0,mk=Object.keys(months).sort(),mrows=mk.map(function(k){acc+=months[k];return '<div class="row"><div class="grow">'+k.replace('-','.')+'</div><div class="sub">'+won(months[k])+'</div><div class="amt">누적 '+won(acc)+'</div></div>'}).reverse().join('');
 return '<header><button class="back" onclick="cid=null;render()">‹ 고객 목록</button><button class="ghost" style="padding:6px 12px" onclick="orderForm(null,\''+cid+'\')">＋ 주문</button></header><div class="sec">'+
 '<div class="card"><h1 style="margin:0 0 2px">'+FL(26)+esc(c.name)+'</h1><div class="sub"><a href="'+telH(c.phone)+'" style="color:var(--pri)">'+esc(c.phone)+'</a> · 총 '+os.length+'건 · '+won(sum(os))+'</div>'+(c.emg?'<div class="sub">비상연락처 <a href="'+telH(c.emg)+'" style="color:var(--pri)">'+esc(c.emg)+'</a></div>':'')+'</div>'+
 (dn.length?'<div class="gal">'+dn.map(function(o){return '<div style="position:relative;flex:none;width:46%"><img data-p="'+(o.done||o.prod)+'" onclick="photoView(\''+o.id+'\',\''+(o.done?'done':'prod')+'\')" alt="" style="width:100%"><span class="tag" style="position:absolute;left:8px;top:8px;background:var(--card)">'+(o.done?'완성':'부케')+'</span></div>'}).join('')+'</div>':'<div class="card empty">사진이 아직 없어요</div>')+
 '</div><h2>주문 내역</h2><div class="sec"><div class="list">'+os.map(function(o){return '<div class="row" onclick="orderForm(\''+o.id+'\')">'+pimg(o.done||o.prod,'thumb')+'<div class="grow"><b>'+esc(o.item||'상품 미입력')+'</b><div class="sub">'+fmtD(o.date)+' · <span class="tag" style="'+(isDone(o)?'background:#dff3e6;color:#1f7a45':'background:var(--line);color:var(--sub)')+'">'+(isDone(o)?'완료':'미완료')+'</span>'+(o.done?' · <span class="tag">완성사진</span>':'')+'</div>'+(o.flowers?'<div class="sub">🌸 '+esc(o.flowers)+'</div>':'')+(o.req?'<div class="sub" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap">📝 '+esc(o.req)+'</div>':'')+infoHtml(o)+'</div><div class="amt">'+won(o.amount)+'</div></div>'}).join('')+'</div></div>'+
 '<h2>월별 누적 금액</h2><div class="sec"><div class="list">'+mrows+'</div></div>'+
 '<div style="display:flex;justify-content:space-between;margin:14px"><button class="ghost" onclick="custForm(\''+cid+'\')">고객 정보 수정</button><button class="del" onclick="delCust(\''+cid+'\')">고객 삭제</button></div>';
}
function vSales(){

 if(salesSeg=='w'){var w0=new Date(wkStart(t)+'T00:00:00');for(i=7;i>=0;i--){var d=new Date(w0);d.setDate(d.getDate()-7*i);k=ymd(d);L.push((d.getMonth()+1)+'/'+d.getDate());V.push(sum(O.filter(function(o){return wkStart(o.date)==k})))}}

  ['소별로망스 엑셀 안내','· 주문 시트의 부케사진·완성사진, 제품 시트의 제품사진이 칸 안에 그대로 들어 있어요.','· 엑셀에서 줄 순서를 정렬하면 사진이 따라오지 않아요. 정렬하지 말고 쓰세요.','· 새로 추가하려면 맨 아래 줄에 이어서 적으세요. (사진은 앱에서 넣어주세요)','· 날짜는 2026-10-24 형식으로 적어주세요.','· 진행상태 칸에는 완료 또는 미완료만 적어주세요.','· 주문문의·부케전달·이니셜·픽업·리뷰 칸은 눌러서 목록에서 고르세요. 이니셜문구는 이니셜추가여부가 예일 때만, 리뷰채널은 리뷰이벤트가 참여일 때만 적어주세요.','· 고객요약 시트는 보기용이라 불러올 때 무시돼요.'].forEach(function(t,i){var r=wa.addRow([t]);if(!i)r.font={bold:true}});
  return wb.xlsx.writeBuffer();
 }).then(function(buf){S.bk=fmtD(today());save();shareFile(new File([buf],'sobyeol-'+today()+'.xlsx',{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'소별로망스 엑셀');render()}).catch(function(e){toast('엑셀을 만들지 못했어요')});
}
function num(v){var n=parseFloat(String(v).replace(/[^\d.\-]/g,''));return isNaN(n)?0:n}
function sv(v){return v==null?'':(v instanceof Date?xdate(v):String(v).trim())}
function xdate(v){var d=null;if(v instanceof Date)d=v;else if(typeof v=='number')d=new Date(Math.round((v-25569)*86400000));if(d)return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');var m=sv(v).replace(/[./]/g,'-').match(/(\d{4})-(\d{1,2})-(\d{1,2})/);return m?m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'):today()}
function xphone(v){var s=sv(v);return /^1\d{9}$/.test(s)?'0'+s:s}
function cv(c){var v=c.value;if(v==null)return '';if(v instanceof Date)return v;if(typeof v=='object'){if(v.richText)return v.richText.map(function(t){return t.text}).join('');if(v.result!=null)return v.result;if(v.text!=null)return v.text;return ''}return v}
function sheetRows(ws){var h={};ws.getRow(1).eachCell(function(c,i){h[i]=sv(cv(c))});var out=[];ws.eachRow(function(row,n){if(n==1)return;var v={};row.eachCell(function(c,i){if(h[i])v[h[i]]=cv(c)});out.push({n:n,v:v})});return out}
function b64(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function sheetImgs(wb,ws,name){var hc=0,m={};ws.getRow(1).eachCell(function(c,i){if(sv(cv(c))==name)hc=i});if(!hc)return m;ws.getImages().forEach(function(im){var col=Math.floor(im.range.tl.nativeCol)+1,row=Math.floor(im.range.tl.nativeRow)+1;if(col==hc){var med=wb.getImage(im.imageId);if(med&&med.buffer)m[row]='data:image/'+(med.extension=='png'?'png':'jpeg')+';base64,'+b64(med.buffer)}});return m}
function gcPhotos(){var used={};S.orders.forEach(function(o){used[o.prod]=1;used[o.done]=1});(S.prods||[]).forEach(function(p){used[p.photo]=1});idb('ph','readwrite',function(s){var c=s.openCursor();c.onsuccess=function(){var cur=c.result;if(cur){if(!used[cur.key])cur.delete();cur.continue()}}})}
function importXlsx(inp){
 var f=inp.files[0];inp.value='';if(!f||needX())return;toast('엑셀 읽는 중…');
 var r=new FileReader();r.onload=function(){
  var wb=new ExcelJS.Workbook();
  wb.xlsx.load(r.result).then(function(){
   var g=function(n){return wb.getWorksheet(n)},wo=g('주문'),wsk=g('재고'),wl=g('재고이력'),wp=g('제품');
   if(!wo&&!wsk&&!wp){toast('소별로망스 엑셀 파일이 아니에요');return}
   var N={customers:S.customers,orders:S.orders,stock:S.stock,log:S.log,prods:S.prods||[],bk:S.bk};
   if(wo){var im1=Object.assign({},sheetImgs(wb,wo,'상품사진'),sheetImgs(wb,wo,'부케사진')),im2=sheetImgs(wb,wo,'완성사진'),cm={},cs=[],os=[];
    sheetRows(wo).forEach(function(R){var x=R.v,n=sv(x['고객명']);if(!n)return;var ph=xphone(x['전화번호']),em=xphone(x['비상연락처']),k=n+'|'+ph,c=cm[k];if(!c){c={id:uid(),name:n,phone:ph,emg:em};cm[k]=c;cs.push(c)}else if(em&&!c.emg)c.emg=em;
     os.push({id:sv(x['주문ID'])||uid(),cid:c.id,date:xdate(x['주문날짜']),item:sv(x['주문상품']),flowers:sv(x['꽃종류']),amount:num(x['금액']),req:sv(x['요청사항']),fin:(function(v){return v=='완료'?true:v=='미완료'?false:undefined})(sv(x['진행상태'])),inq:opt1(x['주문문의방법'],INQ),dlv:opt1(x['부케전달방법'],DL),ini:opt1(x['이니셜추가여부'],['예','아니오']),iniTxt:opt1(x['이니셜추가여부'],['예','아니오'])=='예'?sv(x['이니셜문구']):'',pk:opt1(x['제작후픽업방법'],DL),rv:opt1(x['리뷰이벤트'],['참여','미참여']),rvCh:opt1(x['리뷰이벤트'],['참여','미참여'])=='참여'?opt1(x['리뷰채널'],RVC):'',prod:null,done:null,pD:im1[R.n]||null,dD:im2[R.n]||null})});
    N.customers=cs;N.orders=os}
   if(wsk){N.stock=sheetRows(wsk).filter(function(R){return sv(R.v['자재명'])}).map(function(R){var x=R.v;return{id:sv(x['자재ID'])||uid(),name:sv(x['자재명']),unit:sv(x['단위'])||'개',qty:num(x['수량']),min:num(x['부족기준']),price:num(x['자재금액']),odate:sv(x['주문날짜'])?xdate(x['주문날짜']):'',paid:num(x['결제금액']),pm:opt1(x['결제수단'],PAY)}});
    var ids={},byN={};N.stock.forEach(function(x){ids[x.id]=1;byN[x.name]=x.id});
    N.log=wl?sheetRows(wl).map(function(R){var x=R.v,sid=sv(x['자재ID']);if(!ids[sid])sid=byN[sv(x['자재명'])];return sid?{id:sv(x['이력ID'])||uid(),sid:sid,type:sv(x['구분']),qty:num(x['수량']),date:xdate(x['날짜']),note:sv(x['메모'])}:null}).filter(Boolean):S.log.filter(function(l){return ids[l.sid]})}
   if(wp){var im3=sheetImgs(wb,wp,'제품사진');N.prods=sheetRows(wp).filter(function(R){return sv(R.v['제품명'])}).map(function(R){var x=R.v;return{id:sv(x['제품ID'])||uid(),name:sv(x['제품명']),cost:num(x['제품가격']),site:sv(x['사이트']),qty:num(x['개수']),price:num(x['판매가격']),w:num(x['가로']),l:num(x['세로']),h:num(x['높이']),photo:null,pD:im3[R.n]||null}})}
   var np=0;N.orders.forEach(function(o){if(o.pD)np++;if(o.dD)np++});N.prods.forEach(function(p){if(p.pD)np++});
   ask('엑셀 내용으로 불러올까요? 주문 '+N.orders.length+'건, 재고 '+N.stock.length+'종, 제품 '+N.prods.length+'개, 사진 '+np+'장. 엑셀에 들어 있는 시트의 기록은 엑셀 내용으로 바뀝니다.',function(){
    N.orders.forEach(function(o){if(o.pD)o.prod=putPhoto(o.pD);if(o.dD)o.done=putPhoto(o.dD);delete o.pD;delete o.dD});
    N.prods.forEach(function(p){if(p.pD)p.photo=putPhoto(p.pD);delete p.pD});
    S=N;save().then(function(){gcPhotos();cid=null;closeSheet();render();toast('불러오기 완료')})},'불러오기');
  }).catch(function(e){toast('엑셀 파일을 읽지 못했어요')});
 };r.readAsArrayBuffer(f);
}

open().then(function(){return idb('kv','readonly',function(s){return s.get('state')})}).then(function(d){if(d)S=Object.assign(S,d);S.prods=S.prods||[];try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}render()});
